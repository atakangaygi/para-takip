<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Para">
  <meta name="format-detection" content="telephone=no">
  <title>Para Takip</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <!-- PIN / kilit ekranı -->
  <div id="lock" class="lock">
    <div class="lock-inner">
      <div class="lock-logo" aria-hidden="true">₺</div>

      <div id="lock-intro" class="lock-intro hidden">
        <h1>Para Takip</h1>
        <p>Verilerin yalnızca bu cihazda, belirleyeceğin PIN'den türetilen bir anahtarla <b>şifreli</b> saklanır.</p>
        <div class="warn-box">
          <b>Önemli:</b> PIN'i unutursan veriler <b>kurtarılamaz</b>. Kimse (geliştirici dahil) açamaz.
          Ayarlar → Yedekleme'den düzenli olarak <b>JSON yedeği</b> al ve güvenli bir yerde sakla.
        </div>
        <button class="btn btn-primary btn-block" data-lock="intro-ok">Anladım, PIN belirle</button>
      </div>

      <div id="lock-pin" class="lock-pin">
        <h1 id="lock-title">PIN</h1>
        <p id="lock-sub" class="lock-sub"></p>
        <div id="lock-dots" class="dots" aria-hidden="true"></div>
        <p id="lock-msg" class="lock-msg" role="alert"></p>
        <div id="keypad" class="keypad">
          <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
          <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
          <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
          <button data-key="back" class="key-fn" aria-label="Sil">⌫</button>
          <button data-key="0">0</button>
          <button data-key="ok" class="key-fn key-ok" aria-label="Tamam">✓</button>
        </div>
        <div class="lock-foot">
          <button id="lock-cancel" class="link hidden" data-lock="cancel">Vazgeç</button>
          <button id="lock-forgot" class="link hidden" data-lock="forgot">PIN'imi unuttum</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Alttan açılan panel -->
  <div id="sheet-backdrop" class="backdrop"></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true"></section>

  <!-- Onay penceresi -->
  <div id="dialog-backdrop" class="backdrop backdrop-dialog"></div>
  <div id="dialog" class="dialog" role="alertdialog" aria-modal="true"></div>

  <div id="toast" class="toast" role="status"></div>
  <div id="privacy" class="privacy"><div class="lock-logo">₺</div></div>

  <noscript><p class="noscript">Bu uygulama JavaScript gerektirir.</p></noscript>
</body>
</html>
